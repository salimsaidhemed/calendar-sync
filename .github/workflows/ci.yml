name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/check_test_catalogue.py
      - run: python -m unittest discover -s tests -v
      - run: calendar-sync
      - run: docker build -t calendar-sync:test .
      - run: docker run --rm --network none --read-only calendar-sync:test
      - name: Offline worker container integration
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,mode=1777 --mount "type=bind,src=$PWD/scripts,dst=/checks,readonly" calendar-sync:test python /checks/smoke_worker.py
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
