name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python scripts/check_runtime_lock.py
      - run: python -m pip check
      - run: python scripts/check_test_catalogue.py
      - run: python -m unittest discover -s tests -v
      - run: calendar-sync
      - run: calendar-sync --version
      - run: docker build --build-arg VCS_REF=${{ github.sha }} -t calendar-sync:test .
      - run: docker run --rm --network none --read-only calendar-sync:test calendar-sync --version
      - run: docker run --rm --network none --read-only calendar-sync:test python scripts/check_runtime_lock.py
      - name: Check release image labels
        run: |
          test "$(docker image inspect calendar-sync:test --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$(python -c "from importlib.metadata import version; print(version('tcadc-calendar-sync'))")"
          test "$(docker image inspect calendar-sync:test --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
      - run: docker run --rm --network none --read-only calendar-sync:test
      - name: Offline worker container integration
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,mode=1777 --mount "type=bind,src=$PWD/scripts,dst=/checks,readonly" calendar-sync:test python /checks/smoke_worker.py
      - name: Offline control foundation acceptance
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,mode=1777 --mount "type=bind,src=$PWD/scripts,dst=/checks,readonly" calendar-sync:test python /checks/smoke_control.py
      - name: Offline operator CLI acceptance
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,mode=1777 --mount "type=bind,src=$PWD/scripts,dst=/checks,readonly" calendar-sync:test python /checks/smoke_control_cli.py
      - name: Offline signed web login acceptance
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,mode=1777 --mount "type=bind,src=$PWD/scripts,dst=/checks,readonly" calendar-sync:test python /checks/smoke_web.py
      - name: Disposable web setup and unprivileged startup
        run: |
          fixture="calendar-web-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker volume rm "$fixture-data" "$fixture-secrets"' EXIT
          docker run --rm --network none --read-only --user 0:0 --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --env-file .env.web.example --mount "type=volume,src=$fixture-data,dst=/data" --mount "type=volume,src=$fixture-secrets,dst=/run/web-secrets" --mount "type=bind,src=$PWD/scripts,dst=/checks,readonly" calendar-sync:test python /checks/smoke_web_deployment.py --initialize
          docker run --rm --network none --read-only --cap-drop ALL --env-file .env.web.example --mount "type=volume,src=$fixture-data,dst=/data" --mount "type=volume,src=$fixture-secrets,dst=/run/web-secrets,readonly" --mount "type=bind,src=$PWD/scripts,dst=/checks,readonly" calendar-sync:test python /checks/smoke_web_deployment.py
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Validate isolated UAT template
        run: docker compose --env-file examples/uat/.env.example -f examples/uat/compose.yaml --profile setup config --quiet
      - name: Validate isolated web setup and runtime template
        run: |
          cp .env.web.example .env.web
          docker compose --env-file .env.web -f compose.web.yaml --profile setup config --quiet
