name: calendar-sync-keycloak-local

x-app: &app
  image: ${LOCAL_WEB_UAT_IMAGE:-calendar-sync:keycloak-local}
  build:
    context: ../..
    dockerfile: Dockerfile

x-fixture: &fixture
  image: ${LOCAL_WEB_UAT_FIXTURE_IMAGE:-calendar-sync:keycloak-local-fixture}
  build:
    context: ../..
    dockerfile: examples/keycloak/Dockerfile
    args:
      BASE_IMAGE: ${LOCAL_WEB_UAT_IMAGE:-calendar-sync:keycloak-local}

x-web-env: &web-env
  LOCAL_KEYCLOAK_FIXTURE: localhost-test-only
  WEB_ORIGIN: https://localhost:8443
  KEYCLOAK_ISSUER: https://localhost:9443/realms/calendar-sync-uat
  KEYCLOAK_CLIENT_ID: calendar-sync-uat
  KEYCLOAK_CLIENT_SECRET_FILE: /run/web-secrets/client-secret
  WEB_CONTROL_FILE: /data/web/control/control.sqlite3
  WEB_CONTROL_KEY_FILE: /run/web-secrets/control.key
  WEB_SESSION_FILE: /data/web/sessions/sessions.sqlite3
  WEB_SESSION_KEY_FILE: /run/web-secrets/session.key
  WEB_OIDC_CA_FILE: /uat-tls/ca.crt

services:
  init:
    <<: *fixture
    user: "0:0"
    command: ["python", "/fixture-code/fixture.py", "init"]
    environment: *web-env
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes:
      - web-data:/data
      - web-secrets:/run/web-secrets
      - fixture-data:/fixture
      - keycloak-import:/keycloak-import
      - tls:/uat-tls
  gateway:
    image: caddy:2.11.9
    command: [caddy, run, --config, /uat-tls/Caddyfile, --adapter, caddyfile]
    depends_on:
      init: {condition: service_completed_successfully}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - 127.0.0.1:8443:8443
      - 127.0.0.1:9443:9443
    volumes:
      - tls:/uat-tls:ro
      - gateway-data:/data
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    network_mode: service:gateway
    depends_on:
      gateway: {condition: service_started}
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        IFS= read -r KC_BOOTSTRAP_ADMIN_PASSWORD < /opt/keycloak/data/import/admin-password
        export KC_BOOTSTRAP_ADMIN_PASSWORD
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_HOSTNAME: https://localhost:9443
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_HOST: 127.0.0.1
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_TRUSTSTORE_PATHS: /uat-tls/ca.crt
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
    mem_limit: 1g
    security_opt: [no-new-privileges:true]
    volumes:
      - keycloak-data:/opt/keycloak/data
      - keycloak-import:/opt/keycloak/data/import:ro
      - tls:/uat-tls:ro
    healthcheck:
      test: [CMD, /bin/bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'HEAD /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; IFS= read -r line <&3; [[ $$line == *'200'* ]]"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 45s
  seed:
    <<: *fixture
    command: [python, /fixture-code/fixture.py, seed]
    environment: *web-env
    network_mode: none
    depends_on:
      keycloak: {condition: service_healthy}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - web-data:/data
      - web-secrets:/run/web-secrets:ro
      - tls:/uat-tls:ro
  web:
    <<: *app
    command: [python, -m, calendar_sync.web]
    environment: *web-env
    network_mode: service:gateway
    depends_on:
      seed: {condition: service_completed_successfully}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    volumes:
      - web-data:/data
      - web-secrets:/run/web-secrets:ro
      - tls:/uat-tls:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/healthz',headers={'Host':'localhost:8443'}),timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 20
  tester:
    <<: *fixture
    profiles: [tools]
    user: "0:0"
    command: [python, /fixture-code/test_local.py]
    environment: *web-env
    network_mode: service:gateway
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    volumes:
      - fixture-data:/fixture:ro
      - keycloak-import:/keycloak-import:ro
      - tls:/uat-tls:ro
      - web-data:/data:ro
      - web-secrets:/run/web-secrets:ro
volumes:
  web-data:
  web-secrets:
  fixture-data:
  keycloak-import:
  keycloak-data:
  tls:
  gateway-data:
