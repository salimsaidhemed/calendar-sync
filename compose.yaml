services:
  worker:
    build: .
    env_file: .env
    command: ["calendar-sync", "worker"]
    restart: unless-stopped
    stop_grace_period: 120s
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - sync-data:/data
      - ./secrets/google:/run/secrets/google:rw
      - ./secrets/nextcloud:/run/secrets/nextcloud:ro
    healthcheck:
      test: ["CMD", "calendar-sync", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  sync-data:
