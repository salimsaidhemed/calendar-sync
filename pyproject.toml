[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "tcadc-calendar-sync"
version = "0.1.0.dev0"
description = "Google Workspace to Nextcloud calendar sync repository foundation"
requires-python = ">=3.12"
dependencies = [
    "google-auth>=2.40,<3",
    "google-auth-oauthlib>=1.2.2,<2",
    "requests>=2.32.4,<3",
]

[project.scripts]
calendar-sync = "calendar_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
