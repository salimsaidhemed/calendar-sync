[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "tcadc-calendar-sync"
version = "0.2.0.dev0"
description = "Safe one-way Google Calendar to Nextcloud sync worker"
requires-python = ">=3.12"
dependencies = [
    "google-auth>=2.40,<3",
    "google-auth-oauthlib>=1.2.2,<2",
    "requests>=2.32.4,<3",
    "icalendar>=6.3,<8",
    "defusedxml>=0.7.1,<1",
    "cryptography>=50,<51",
    "fastapi>=0.163.1,<0.164",
    "uvicorn>=0.54,<0.55",
    "authlib>=1.9.8,<2",
    "joserfc>=1.8,<2",
    "httpx>=0.28.1,<0.29",
]

[project.scripts]
calendar-sync = "calendar_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
